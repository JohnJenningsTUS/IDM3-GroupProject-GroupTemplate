name: ci
on:
  pull_request:
    branches: [develop, main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: idm3project2024
          MYSQL_USER: gallery
          MYSQL_PASSWORD: gallerypass
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-retries=20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Download Maven
        env:
          MVNW_VERBOSE: "true"
        run: |
          for i in 1 2 3; do
            ./mvnw -B -v && exit 0
            echo "Download failed, retrying in 15 seconds"; sleep 15
          done
          exit 1
      - run: ./mvnw -B verify
      - name: Load the sample data
        run: |
          for i in $(seq 1 30); do
            docker exec ${{ job.services.db.id }} mysql -uroot -prootpass -e 'SELECT 1' > /dev/null 2>&1 && break
            sleep 2
          done
          docker exec -i ${{ job.services.db.id }} mysql -uroot -prootpass idm3project2024 < idm3project2024.sql
      - name: Start the app
        run: nohup java -jar target/*.jar > app.log 2>&1 &
      - name: Smoke check
        run: bash .github/smoke-check.sh
      - name: Show the app log
        if: failure()
        run: cat app.log
